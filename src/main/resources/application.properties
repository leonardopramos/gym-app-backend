spring.application.name=backend

# Configuração por ambiente: em execução local o banco fica exposto em localhost;
# dentro de um compose, use DB_HOST=mysql.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gym_app}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:gym_app}
spring.datasource.password=${DB_PASSWORD:gym_app}

spring.flyway.enabled=${FLYWAY_ENABLED:true}

# Configurações JWT
jwt.secret=${JWT_SECRET:9a782b6c4d5e1f0a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Documentação OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
